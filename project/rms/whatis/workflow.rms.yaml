name: kbe
description: create KBE (Kubernetes Easy) clusters
phases:
  CheckSshConf:
    description: check node is SSH configured on the host (aka. ~/.ssh/config.d/)
    target: node.bastion
    # fn: CheckSshConf
    resource: SshConf
    capability: Check
    param: 
      - node.all

  CheckSshAccess:
    description: Check node is SSH reachable from the host
    target: node.bastion
    # fn: CheckSshAccess
    resource: SshAccess
    capability: Check
    param:
      - node.all
    dependency:
      - CheckSshConf

  DeployAgent:
    description: copy luca agent from the host to the node (only if it is different from the host)
    target: node.bastion
    # fn: DeployAgent
    resource: Tool
    capability: Deploy
    param: 
      - node.all
      - agent
    dependency:
      - CheckSshAccess

  UpgradeOs:
    description: Upgrade node (linux OS) native repositories and packages to the latest version
    target: node.all
    # fn: UpgradeOs
    resource: Os
    capability: Upgrade
    dependency:
      - DeployAgent

  RebootIfNeeded:
    description: Reboot a node if needed
    target: node.all
    # fn: RebootIfNeeded
    resource: Vm
    capability: RebootIfNeeded
    dependency:
      - UpgradeOs

  WaitIsOnline:
    description: Check a node is ssh reachable from a host (after a possible reboot) within a delay
    target: node.bastion
    # fn: WaitIsOnline
    resource: Vm
    capability: WaitIsOnline
    param: 
      - node.all
      - ssh.delay
    dependency:
      - RebootIfNeeded

  UpdateOs:
    description: Provision required/missing native standard OS packages
    target: node.all
    # fn: UpdateOs
    resource: Os
    capability: Update
    dependency:
      - WaitIsOnline

  AddRepoNative:
    description: Provision native OS package repository(ies)
    target: node.all
    # fn: AddRepoNative
    resource: Repo/Package
    capability: Install
    param:
      - onpm.repo.crio
      - onpm.repo.k8s
    dependency:
      - UpdateOs

  AddPkgNative:
    description: Provision native OS package(s)
    target: node.all
    # fn: AddPkgNative
    resource: Package/Os    # discover if it is dnf/apt/apk
    capability: Install
    param:
      - onpm.pkg.crio
      - onpm.pkg.kubeadm
      - onpm.pkg.kubelet
    dependency:
      - AddRepoNative

  AddKModule:
    description: Load linux OS kernel module(s)
    target: node.all
    # fn: AddKModule
    resource: Kernel/module
    capability: Load
    param:
      - kernel.module
      - file.kernel
    dependency:
      - AddPkgNative

  AddKParam:
    description: Set linux OS kernel parameter(s)
    target: node.all
    # fn: AddKParam
    resource: Kernel/parameter
    capability: Set
    param:
      - kernel.param
      - file.kernel
    dependency:
      - AddKModule

  SelinuxConfigure:
    description: Configure SELinux
    target: node.all
    # fn: SelinuxConfigure
    resource: Selinux
    capability: Configure
    dependency:
      - AddKParam

  ServiceEnable:
    description: Enable existing OS services to start after a reboot
    target: node.all
    # fn: EnableService
    resource: Service
    capability: Enable
    param:
      - service.crio
      - service.kubelet
    dependency:
      - SelinuxConfigure

  ServiceStart:
    description: Start existing OS services for the current session
    target: node.all
    # fn: StartService
    resource: Service
    capability: Start
    param:
      - service.crio
    dependency:
      - ServiceEnable

  ServiceStop:
    description: Stop existing OS services for the current session
    target: node.all
    # fn: StopService
    resource: Service
    capability: Stop
    param:
      - service.kubelet
    dependency:
      - ServiceStart


  AddPkgNative2:
    description: Provision native OS package(s)
    target: node.cp
    # fn: AddPkgNative
    resource: Package/Os    # discover if it is dnf/apt/apk
    capability: Install
    param:
      - onpm.pkg.kubectl
      - onpm.pkg.yq
    dependency:
      - ServiceStop 

  ResetCplane:
    description: Reset the control plane node(s)
    target: node.cp
    # fn: ResetNode
    resource: Vm
    capability: Reset
    dependency:
      - AddPkgNative2

  InitCplane:
    description: Initialize/bootstrap the cluster
    target: node.cp
    # fn: InitCplane
    resource: K8s/Cluster
    capability: Init
    param:
      - cluster.parameter
      - ContainerRuntime.socketName
    dependency:
      - ResetCplane

  ResetWorker:
    description: Reset the worker node(s)
    target: node.worker
    # fn: ResetNode
    resource: Vm
    capability: Reset
    dependency:
      - InitCplane

  AddWorker:
    description: Add worker node(s) to the cluster
    target: node.worker
    # fn: AddWorker
    resource: K8s/Worker
    capability: Add
    param:
      - node.cp
    dependency:
      - ResetWorker

  ConfigureKubectl:
    description: Configure kubectl
    target: node.bastion
    # fn: ConfigureKubectl
    resource: Tool/Kubectl
    capability: Configure
    param:
      - node.cp
      - node.kubectl
    dependency:
      - AddWorker

  AddPkgGo:
    description: install Go CLI(s)
    target: node.cp
    # fn: AddPkgGo
    resource: Package/Go
    capability: Install
    param:
      - gopm.cp
      - file.binf
    dependency:
      - ConfigureKubectl

  CreateRcFile:
    description: Create a user's custom RC file
    target: node.bastion
    # fn: CreateRcFile
    resource: File/Rc
    capability: Create
    param:
      - node.cp
      - file.crc
    dependency:
      - AddPkgGo

  RcAddPath:
    description: Update the user's custom RC file by adding the envvar:PATH
    target: node.bastion
    # fn: RcAddPath
    resource: File
    capability: AddLine # Add with a comment to be able to remove it later
    param:
      - node.cp
      - file.binf
      - file.crc
    dependency:
      - CreateRcFile

  AddRepoHelm:
    description: Install Helm charts repositories on the helm client (node.helm)
    target: node.bastion
    # fn: AddRepoHelm
    resource: Repo/Helm
    capability: Add
    param:
      - helm.repo
      - node.helm
    dependency:
      - RcAddPath

  FixCiliumDns:
    description: Fix missing file resolv.conf on some linux distro - for CNI:Cilium:1.18.5 to works for all linux distro
    target: node.all
    # fn: FixDns
    resource: File
    capability: create
    dependency:
      - RcAddPath

  AddCniCilium:
    description: Install the CNI cilium, as a helm release, into the the cluster.
    target: node.bastion
    # fn: InstallReleaseHelm
    resource: Helm/Release
    capability: Install
    param:
      - helm.release
      - node.helm
    dependency:
      - FixCiliumDns

  # AddIngressCilium:
  #   description: Install the Ingress cilium as an addon to the CNI cilium (helm release)
  #   target: node.helm
  #   # fn: InstallIngressCilium
  #   param:
  #     - helm.upgrade
  #   dependency:
  #     - FixCiliumDns
